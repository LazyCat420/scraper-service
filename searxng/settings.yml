# Only the engines scraper-service pins (SEARXNG_ENGINES=bing,wikipedia in
# docker-compose.yml) exist at all. With every default engine enabled, a
# request without an `engines` parameter fanned out to DuckDuckGo, Google,
# Startpage, Mojeek and the rest, which bot-block this network's one public
# IP; each attempt deepened a block every service in the house shares.
use_default_settings:
  engines:
    keep_only:
      - bing
      - wikipedia
server:
  secret_key: "scraper-sidecar-internal-not-a-real-secret"
  limiter: false
search:
  formats:
    - html
    - json
# Proxy egress hook (2026-09-21): if engines start IP-flagging the NAS, set
# proxies here — no code change needed. Example:
# outgoing:
#   proxies:
#     all://:
#       - http://user:pass@proxy-host:port
#       - socks5h://user:pass@proxy2-host:port
# SearXNG rotates across the list per engine. Prefer one stable egress IP
# (e.g. a $5 VPS over WireGuard) over free proxy pools: free proxies are
# captcha-walled, query-sniffing MITMs that degrade results below baseline.

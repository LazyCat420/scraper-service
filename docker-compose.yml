services:
  scraper-service:
    image: ${IMAGE_NAME:-scraper-service}:latest
    container_name: ${IMAGE_NAME:-scraper-service}
    ports:
      - "${PORT:-8001}:8001"
    env_file: .env
    environment:
      - TZ=America/Los_Angeles
    # ── Why this container needs an init and a PID cap (2026-08-20) ──────
    # Playwright orphans a Chromium whenever a scrape fails. Without an
    # init, uvicorn IS pid 1 here and never reap()s, so every orphan became
    # a permanent zombie. 20,179 of them exhausted the HOST's pid space
    # (kernel.pid_max = 32768): fork() started returning EAGAIN box-wide,
    # which killed the Docker daemon, wedged systemd's D-Bus name, and took
    # the whole NAS down — twice. `init: true` runs tini as pid 1, which
    # reaps orphans; pids_limit means a future leak kills this container
    # instead of the machine. 1024 leaves room for real work: the pids
    # cgroup counts THREADS, and one headless Chromium is ~100 tasks.
    init: true
    pids_limit: 1024
    volumes:
      - ./cookies.txt:/app/cookies.txt:ro
      # ── Why the failure cache needs a volume (2026-09-03) ──────────────
      # /app/logs holds failure_cache.db: the per-DOMAIN article-quality
      # record (thin_streak, good_count, last_thin_at) plus dead_urls. It is
      # what stops the collector re-fetching a domain that only ever returns
      # a title. Measured 2026-09-03: 254 domains learned, 7 of them earning
      # a skip (investors.com at a 19-thin streak, then zacks, biztoc,
      # youtube, ft, marketwatch, x.com). Inside the container that record
      # died with every rebuild and had to be re-learned one wasted fetch per
      # URL at a time. A named volume rather than a bind mount: SQLite in WAL
      # mode wants a real filesystem, not a Synology bind path.
      - scraper-logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          # Chromium is hungry; 2 uvicorn workers each boot their own browser.
          memory: 4G

volumes:
  scraper-logs:

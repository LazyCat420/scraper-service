services:
  scraper-service:
    image: ${IMAGE_NAME:-scraper-service}:latest
    container_name: ${IMAGE_NAME:-scraper-service}
    ports:
      - "${PORT:-8001}:8001"
    env_file: .env
    environment:
      - TZ=America/Los_Angeles
      # 2026-09-21: NAS egress has per-engine reputation flags (google access
      # denied, brave rate-suspended, ddg CAPTCHA'd) while bing serves fine.
      # Pin to working engines; SEARXNG_ENGINES="" restores the full
      # federation once reputation decays. Collector reads this env directly.
      - SEARXNG_ENGINES=${SEARXNG_ENGINES:-bing,wikipedia}
    # ── Why this container needs an init and a PID cap (2026-08-20) ──────
    # Playwright orphans a Chromium whenever a scrape fails. Without an
    # init, uvicorn IS pid 1 here and never reap()s, so every orphan became
    # a permanent zombie. 20,179 of them exhausted the HOST's pid space
    # (kernel.pid_max = 32768): fork() started returning EAGAIN box-wide,
    # which killed the Docker daemon, wedged systemd's D-Bus name, and took
    # the whole NAS down — twice. `init: true` runs tini as pid 1, which
    # reaps orphans; uvicorn cannot.
    #
    # ⚠ pids_limit IS DISCARDED ON THIS BOX. DSM's kernel (4.4.302+) has no
    # pids cgroup controller — `grep -w pids /proc/cgroups` is empty and
    # `docker inspect` reports PidsLimit=<nil> — so every deploy prints
    # "PIDs limit discarded" and no limit is applied. It has never been in
    # effect, including during both outages. Kept because it costs nothing and
    # becomes real on a kernel that supports it, but the containment it
    # promises does not exist here: see OPERATIONS.md. What actually bounds
    # browser count is SCRAPER_MAX_BROWSERS (default 4, per uvicorn worker).
    init: true
    pids_limit: 1024
    volumes:
      - ./cookies.txt:/app/cookies.txt:ro
      # ── Why the failure cache needs a volume (2026-09-03) ──────────────
      # /app/logs holds failure_cache.db: the per-DOMAIN article-quality
      # record (thin_streak, good_count, last_thin_at) plus dead_urls. It is
      # what stops the collector re-fetching a domain that only ever returns
      # a title. Measured 2026-09-03: 254 domains learned, 7 of them earning
      # a skip (investors.com at a 19-thin streak, then zacks, biztoc,
      # youtube, ft, marketwatch, x.com). Inside the container that record
      # died with every rebuild and had to be re-learned one wasted fetch per
      # URL at a time. A named volume rather than a bind mount: SQLite in WAL
      # mode wants a real filesystem, not a Synology bind path.
      - scraper-logs:/app/logs
    restart: unless-stopped
    healthcheck:
      # wget exits non-zero on a 503, which is what makes /health's new
      # dependency checks able to mark this container unhealthy at all. While
      # /health was a hardcoded literal, this line could only ever pass.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          # Chromium is hungry; 2 uvicorn workers each boot their own browser.
          memory: 4G

  # ── SearXNG sidecar (2026-09-21) ──
  # Keyless meta-search (brave/google/bing federation) exposed to every agent
  # via /collect source=searxng. DDG does not serve this NAS IP
  # (DISABLE_DDG_SEARCH=true on every deploy); bench/web measured SearXNG
  # 30/30 success, nDCG@5 0.933, ~0.8s p50 vs ddg-lite 0/30.
  # Internal only: no host port. Limiter off is safe on the internal network;
  # the JSON format is enabled via the mounted settings file.
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped
    mem_limit: 512m

volumes:
  scraper-logs:
